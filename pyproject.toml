[project]
name = "petslice-fm"
version = "0.1.0"
description = "2D foundation models with LoRA and attention pooling for whole-body PET/CT classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "timm>=1.0.20",
    "transformers>=4.56",
    "safetensors",
    "huggingface-hub",
    "monai>=1.5",
    "dynamic-network-architectures>=0.4",
    "nibabel>=5.3",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "pyyaml>=6",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "einops>=0.8.2",
    "spectre-fm>=0.2.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petslice"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 100
extend-exclude = ["src/petslice/models/davit.py"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
